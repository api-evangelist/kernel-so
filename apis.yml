apis:
- aid: kernel-so:kernel-mcp-server
  name: Kernel MCP Server
  description: >-
    Hosted Model Context Protocol server at mcp.onkernel.com that exposes Kernel resources (browsers,
    profiles, proxies, apps) as MCP tools and bundles four standalone tools — computer actions, Playwright
    execution with replay, shell exec, and documentation search — to Claude, Cursor, VS Code, Zed, and
    any MCP-compatible agent. Authenticates via OAuth 2.1 or API key.
  humanURL: https://www.kernel.sh/docs/reference/mcp-server
  baseURL: https://mcp.onkernel.com/mcp
  tags:
  - Agents
  - MCP
  properties:
